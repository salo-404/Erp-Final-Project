services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mini_erp
      POSTGRES_PASSWORD: mini_erp
      POSTGRES_DB: mini_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
